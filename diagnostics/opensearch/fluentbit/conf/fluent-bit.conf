[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.path  /var/lib/fluentbit/storage
    storage.sync  normal
    storage.checksum off
    storage.backlog.mem_limit 50M
    storage.max_chunks_up 128

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    Parser            cri
    DB                /var/lib/fluentbit/flb_kube.db
    DB.locking        true
    Buffer_Chunk_Size 512KB
    Buffer_Max_Size   2MB
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Ignore_Older      24h
    Rotate_Wait       30
    Read_from_Head    False

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On
    Labels              On
    Annotations         Off
    Buffer_Size         0

[FILTER]
    Name    lua
    Match   kube.*
    script  /fluent-bit/scripts/tenant_extract.lua
    call    extract_tenant_and_set_index

[OUTPUT]
    Name            es
    Match           kube.*
    Host            ${ES_HOST}
    Port            ${ES_PORT}
    TLS             ${ES_TLS}
    TLS.Verify      Off
    Suppress_Type_Name On
    Logstash_Format On
    Logstash_Prefix filebeat-fluentbit
    Logstash_Prefix_Key index_prefix
    Logstash_DateFormat %Y.%m.%d
    Replace_Dots    On
    Retry_Limit     5
    Buffer_Size     512KB
    Generate_ID     On
    Write_Operation create
    Workers         2
    net.keepalive         On
    net.keepalive_idle_timeout 30
    Trace_Error     On
